name: Build Qazaq Keyboard
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @keymanapp/kmc

      - name: Generate Keyman template project
        run: |
          mkdir -p /tmp/template
          cd /tmp/template
          kmc generate keyman-keyboard qazaq_latin_n --name "Qazaq Latin N" --language kk || kmc generate keyman-keyboard qazaq_latin_n
          ls -R

      - name: Copy template + your keyboard files
        run: |
          cp /tmp/template/qazaq_latin_n/qazaq_latin_n.kpj ./ || cp /tmp/template/qazaq_latin_n.kpj ./
          mkdir -p source
          cp /tmp/template/qazaq_latin_n/source/* ./source/ 2>/dev/null || cp /tmp/template/qazaq_latin_n/source/* . 2>/dev/null || true
          cp qazaq_latin_n.kmn ./source/qazaq_latin_n.kmn
          cp qazaq_latin_n.keyman-touch-layout ./source/qazaq_latin_n.keyman-touch-layout
          echo "# Qazaq Latin N" > LICENSE.md
          echo "MIT License - Qazaq Translit" >> LICENSE.md
          ls -R

      - name: Patch project for iPhone-only build
        run: |
          python3 - << 'PY'
          import xml.etree.ElementTree as ET, pathlib
          p = pathlib.Path("source/qazaq_latin_n.kps")
          tree = ET.parse(p)
          root = tree.getroot()
          # Remove any <File> that references .kvk / .kvks - delete the whole block, not just one line
          for parent in root.iter():
              for child in list(parent):
                  if child.tag == "File":
                      text = "".join(child.itertext())
                      if ".kvk" in text:
                          parent.remove(child)
          tree.write(p, encoding="utf-8", xml_declaration=True)
          print(p.read_text())
          # Add KeyboardVersion if missing
          kmn = pathlib.Path("source/qazaq_latin_n.kmn")
          t = kmn.read_text()
          if "keyboardversion" not in t.lower():
              lines = t.splitlines()
              lines.insert(1, 'store(&KeyboardVersion) "1.0"')
              kmn.write_text("\n".join(lines)+"\n")
          print("--- KMN HEAD ---")
          print("\n".join(kmn.read_text().splitlines()[:20]))
          PY
          ls -R source/

      - name: Build project
        run: kmc build qazaq_latin_n.kpj

      - name: Find build output
        run: |
          echo "--- ALL FILES ---"
          find . -type f | sort
          echo "--- KMP / KMX ---"
          find . -name "*.kmp" -o -name "*.kmx" | sort

      - uses: actions/upload-artifact@v4
        with:
          name: qazaq_latin_n.kmp
          path: "**/*.kmp"
          if-no-files-found: error

      - name: Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: "**/*.kmp"
          fail_on_unmatched_files: true

      - name: Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: |
            build/qazaq_latin_n.kmp
            qazaq_latin_n.kmp
          fail_on_unmatched_files: false
