name: Build Qazaq Keyboard
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @keymanapp/kmc
      - run: kmc build qazaq_latin_n.kmn --out-path build/
      - uses: actions/upload-artifact@v4
        with:
          name: qazaq_latin_n.kmp
          path: build/
